<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10322c">
<title>Repaso de Mates</title>
<!--
  REPASO DE MATES v1 - repaso de cálculo mental con números enteros (1º-2º ESO)
  Archivo único: HTML + CSS + JS, sin librerías ni recursos externos. Funciona sin internet.
  Se genera con tests/build.cjs a partir de tests/src/ (ver ESPECIFICACION.md).

  MODO DE PRUEBAS: solo con ?test=1 existe window.__JUEGO__ y se acepta ?seed=N (semilla). Sin ?test=1 se ignora (aula).

  DECISIONES DE DISEÑO:
    - El alumno ELIGE el tema a repasar antes de empezar (5 temas, cada uno con niveles 1-10).
    - Dentro del tema el nivel sube si acierta (modelo bayesiano, ≈ 72 % de acierto previsto, salto máximo de 1 nivel).
    - Refuerzo: si falla 4 de las últimas 6 (con al menos 5 respondidas) baja el nivel, muestra la regla y repite hasta acertar 3 seguidas.
    - Las preguntas falladas vuelven más adelante con otros números.
    - Sin reloj ni clasificación. Progreso guardado por número de lista y tema en este dispositivo.
    - PIN de profesorado guardado como huella (hash) con bloqueo progresivo (3 fallos = 30 s, luego se duplica).
    - CSV con separador ";" y BOM UTF-8 (Excel en español).
-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --noche:#10322c;--noche2:#1d5247;--rojo:#d62839;--verde:#157a45;--verde-s:#0d4f2c;--oro:#ffe27a;--tiza:#f3f1e7;--tiza2:#b9d8cf;--acento:#ffe27a;
  --tinta:#12263f;--papel:#f8fbff;--azul:#2d6cdf;--suave:#5a6e8a;
  --tecla:clamp(56px,8.4vh,84px);
}
@supports (height:1dvh){:root{--tecla:clamp(56px,8.4dvh,84px)}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--noche);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(ellipse at 30% 20%,#1d5247 0%,#10322c 60%,#0a211d 100%) fixed}
#nieve{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:fixed;top:0;left:0;right:0;bottom:0;height:100%;z-index:1;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@supports (height:1dvh){#app{height:100dvh}}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
/* foco visible: selectores SEPARADOS (Safari < 15.4 descarta toda la regla si no entiende :focus-visible) */
button:focus-visible{outline:4px solid var(--oro);outline-offset:3px}
input:focus-visible{outline:4px solid var(--oro);outline-offset:2px}
textarea:focus-visible{outline:4px solid var(--oro);outline-offset:2px}
#modal-caja button:focus-visible{outline:4px solid #12263f;outline-offset:2px}
#modal-caja textarea:focus-visible{outline:4px solid #12263f;outline-offset:2px}
.tecla:focus-visible{outline:4px solid var(--oro);outline-offset:3px}
input,textarea{font-size:16px;-webkit-user-select:text;user-select:text}
sup{font-size:.55em;line-height:0;position:relative;top:-.85em;vertical-align:baseline;margin-left:1px}
[hidden]{display:none!important}

/* barra superior */
#barra{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:56px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 8px;font-size:22px;font-weight:800;
  color:#fff;letter-spacing:.2px;min-height:44px;white-space:nowrap;flex:0 1 auto;min-width:0}
.logo span{text-shadow:0 2px 0 rgba(0,0,0,.35)}
#chip-alumno{margin-left:auto;background:rgba(255,255,255,.16);border-radius:999px;padding:8px 16px;font-weight:700;font-size:18px;white-space:nowrap;flex:0 0 auto}
.btn-barra{flex:0 0 auto;min-height:56px;min-width:56px;padding:0 16px;border-radius:14px;border:0;background:rgba(255,255,255,.2);font-weight:800;font-size:18px;color:#fff;white-space:nowrap}
#btn-pausa{margin-left:auto}
#btn-sonido{margin-left:auto;flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.18);font-size:28px}
#chip-alumno:not([hidden])+#btn-sonido,#btn-salir:not([hidden])+#btn-sonido,#btn-pausa:not([hidden])+#btn-salir+#btn-sonido{margin-left:0}
#btn-pausa:not([hidden])~#chip-alumno{margin-left:0}

/* pantallas */
#pantallas{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.pantalla{display:none;flex:1;min-height:0;flex-direction:column;padding:6px 16px 14px;position:relative}
.pantalla.activa{display:flex}
.pantalla.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
h1,h2,h3{margin:0}
.titulo{font-size:clamp(30px,5.4vmin,56px);font-weight:900;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sub{font-size:clamp(18px,2.6vmin,26px);text-align:center;opacity:.95;margin:4px 0 0}

/* botones */
.btn{min-height:56px;padding:12px 22px;border-radius:16px;border:0;font-weight:800;font-size:20px;
  background:#fff;color:var(--tinta);box-shadow:0 4px 0 #9fb3cc}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3cc}
.btn.rojo{background:var(--rojo);color:#fff;box-shadow:0 4px 0 #8c1722}
.btn.verde{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s)}
.btn.oro{background:var(--oro);color:#3a2a00;box-shadow:0 4px 0 #b88a0c}
.btn.suave{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.btn.pequeno{min-height:56px;font-size:18px;padding:10px 16px}

/* teclado propio */
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tecla{height:var(--tecla);font-size:calc(var(--tecla)*.46);font-weight:800;border-radius:16px;border:0;
  background:#fff;color:var(--tinta);box-shadow:0 4px 0 #9fb3cc;min-width:44px;padding:0}
.tecla:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3cc;background:#e8f0fb}
.tecla.acc{background:#ffe3a3;box-shadow:0 4px 0 #c79a2a}
.tecla.ok{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s);grid-column:span 2;font-size:calc(var(--tecla)*.36)}
.tecla.nose{background:rgba(255,255,255,.88);font-size:calc(var(--tecla)*.30);color:#2f4766}
.tecla.vacia{visibility:hidden}
.tecla.entrar{grid-column:span 3;background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s);font-size:calc(var(--tecla)*.38)}

/* pantalla número de lista (con scroll de seguridad en pantallas bajas) */
#p-curso{align-items:center}
.curso-caja{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:640px;margin:auto 0;text-align:center}
.fila-opc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opc{min-width:84px;min-height:64px;padding:8px 18px;border-radius:16px;border:3px solid var(--tiza);background:rgba(255,255,255,.1);color:var(--tiza);font:700 26px/1 inherit;font-family:inherit;touch-action:manipulation;cursor:pointer}
.opc.sel{background:var(--acento);color:#10322c;border-color:#fff}
#curso-sig:disabled{opacity:.45}
#p-lista{align-items:center}
.lista-grid{display:grid;gap:14px 40px;width:100%;max-width:1000px;align-items:center;margin:auto 0}
.lista-izq{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;justify-content:center}
.lista-der{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:420px;width:100%;margin:0 auto}
.escena{display:flex;align-items:flex-end;justify-content:center;gap:6px;font-size:clamp(34px,6vmin,64px);line-height:1;min-height:0}
.escena svg{height:clamp(120px,24vmin,260px);width:auto}
.visor{background:#fff;color:var(--tinta);border-radius:18px;min-height:80px;display:flex;align-items:center;justify-content:center;
  font-size:56px;font-weight:900;letter-spacing:2px;border:4px solid var(--oro)}
.visor.vacio{color:var(--suave);font-size:30px;font-weight:700;letter-spacing:0}
.msg{min-height:28px;text-align:center;font-size:20px;font-weight:700;color:#ffd0d4}
.sacudir{animation:sacudir .35s}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (orientation:landscape) and (min-width:700px){.lista-grid{grid-template-columns:1fr 1fr}}

/* gamificación: partículas, medallas, llama de racha y transiciones entre cuentas */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.part{position:absolute;left:0;top:0;font-size:26px;line-height:1;will-change:transform,opacity;animation:vuela .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes vuela{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}15%{opacity:1;transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.3)) scale(1.2) rotate(calc(var(--rot)*.3))}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 70px)) scale(.9) rotate(var(--rot))}}
.mas-uno{position:absolute;left:0;top:0;font-weight:900;font-size:30px;color:#fff;text-shadow:0 2px 0 #157a45,0 0 10px #7be39a;animation:sube 1s ease-out forwards}
@keyframes sube{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
#medalla-pop{position:fixed;left:50%;top:84px;transform:translate(-50%,-30px) scale(.8);opacity:0;z-index:70;pointer-events:none;display:flex;align-items:center;gap:12px;
  background:linear-gradient(160deg,#fff7cf,#ffd23f);color:#3a2a00;border:4px solid #fff;border-radius:22px;padding:8px 22px 8px 14px;box-shadow:0 8px 0 rgba(0,0,0,.28),0 0 40px rgba(255,210,63,.8);max-width:92vw}
#medalla-pop.ver{animation:pop-med 2.4s cubic-bezier(.2,.8,.3,1) forwards}
#medalla-pop .ic{font-size:clamp(40px,8vmin,58px);line-height:1;animation:gira 1.1s ease-out}
#medalla-pop b{display:block;font-size:clamp(18px,3vmin,26px);font-weight:900}
#medalla-pop span{display:block;font-size:clamp(13px,2.2vmin,17px);font-weight:700}
#medalla-pop .nueva{display:inline-block;background:#c62839;color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;margin-left:6px;vertical-align:middle}
@keyframes pop-med{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-20px) scale(.95)}}
@keyframes gira{0%{transform:scale(.2) rotate(-200deg)}70%{transform:scale(1.25) rotate(15deg)}100%{transform:scale(1) rotate(0)}}
#medalla-pop.nivel{background:linear-gradient(160deg,#d6f5ff,#7ed3ff);color:#06304a}
#expr.entra{animation:entra .32s cubic-bezier(.2,.8,.3,1)}
@keyframes entra{0%{opacity:0;transform:translateX(46px) scale(.96)}100%{opacity:1;transform:none}}
#resp.pop{animation:popresp .5s}
@keyframes popresp{0%{transform:scale(1)}35%{transform:scale(1.16);box-shadow:0 0 0 10px rgba(123,227,154,.55)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(123,227,154,0)}}
.tarjeta.brilla{animation:brilla .6s}
@keyframes brilla{0%{box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 0 rgba(123,227,154,.9)}100%{box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 28px rgba(123,227,154,0)}}
.tarjeta.tiembla{animation:sacudir .4s}
#h-racha.llama1{color:#ffd23f}
#h-racha.llama2{color:#ff9f1c;animation:llama 1s infinite}
#h-racha.llama3{color:#ff5a36;animation:llama .6s infinite;text-shadow:0 0 12px #ffb347}
@keyframes llama{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.barranivel i.sube{animation:destello .9s}
@keyframes destello{0%,100%{filter:none}40%{filter:brightness(1.8) drop-shadow(0 0 6px #fff)}}
.estante{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.med{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.06);border-radius:14px;padding:8px 10px;text-align:left}
.med .ic{font-size:34px;line-height:1}
.med b{display:block;font-size:15px}.med small{display:block;font-size:12.5px;opacity:.85}
.med.no{opacity:.4;filter:grayscale(1)}
.chip-med{cursor:pointer;font:inherit;padding:2px 12px;min-height:0}
.res-medallas{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.res-medallas span{background:#fff7cf;color:#3a2a00;border-radius:14px;padding:4px 12px;font-weight:800;font-size:16px}
@media (prefers-reduced-motion:reduce){#medalla-pop.ver{animation:none;opacity:1;transform:translate(-50%,0)}}

/* sala de trofeos */
#p-trofeos{align-items:center;gap:12px;background:radial-gradient(ellipse at 50% 0%,rgba(255,226,122,.18),transparent 60%)}
.sala{width:100%;max-width:1040px;display:flex;flex-direction:column;gap:14px}
.sala-stats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sala-stats span{background:rgba(0,0,0,.35);border:2px solid var(--tiza2);border-radius:999px;padding:5px 14px;font-weight:800;font-size:clamp(14px,2vmin,18px)}
.vitrina{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:3px solid #b98a4a;border-radius:18px;padding:10px 14px 0;box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.vitrina h2{margin:0 0 6px;font-size:clamp(17px,2.6vmin,24px);color:#ffe27a}
.balda{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding-bottom:12px;border-bottom:12px solid #8a5a24;box-shadow:0 6px 0 #5b3a14}
.trofeo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:6px 4px;border-radius:12px;min-width:0}
.trofeo .ic{font-size:clamp(38px,6.5vmin,56px);line-height:1;position:relative}
.trofeo .ic i{position:absolute;right:-12px;bottom:-4px;font-style:normal;font-size:.55em}
.trofeo b{font-size:clamp(13px,1.9vmin,16px)}
.trofeo small{font-size:clamp(11.5px,1.6vmin,14px);opacity:.9}
.trofeo.si .ic{filter:drop-shadow(0 0 8px rgba(255,226,122,.9));animation:brillo 3s ease-in-out infinite}
.trofeo.si:nth-child(2n) .ic{animation-delay:.7s}.trofeo.si:nth-child(3n) .ic{animation-delay:1.4s}
@keyframes brillo{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.trofeo.no{opacity:.38;filter:grayscale(1)}
.sala-nota{font-size:clamp(13px,1.8vmin,16px);text-align:center;opacity:.95}
#mapa-guarda{width:100%;max-width:1040px;font-size:clamp(13px,1.8vmin,16px);font-weight:700;text-align:center;background:rgba(255,226,122,.16);border:2px dashed #ffe27a;border-radius:14px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){.trofeo.si .ic{animation:none}}

.filtro-pp{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:6px 0;font-weight:700}
.filtro-pp label{display:flex;gap:6px;align-items:center}
.filtro-pp select{font:inherit;font-weight:700;padding:6px 10px;border-radius:10px;border:2px solid #8fa6c6;background:#fff;color:#10322c;min-height:40px}
.filtro-pp .cuenta{margin-left:auto;font-size:.9em;opacity:.85}

/* menú */
#p-menu{align-items:center;gap:12px}
.modos{display:grid;gap:16px;width:100%;max-width:1000px;flex:1 0 auto;min-height:0;align-content:center}
@media (orientation:landscape) and (min-width:700px){.modos{grid-template-columns:1fr 1fr}}
.modo{background:linear-gradient(160deg,#fff 0%,#e6f0ff 100%);color:var(--tinta);border:0;border-radius:24px;padding:18px 20px;
  text-align:center;box-shadow:0 6px 0 #8fa6c6;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
.temas{grid-template-columns:1fr!important}
@media (min-width:700px){.temas{grid-template-columns:1fr 1fr!important}}
.modo .niv{font-size:15px;font-weight:700;color:#3d5a52;margin-top:2px}
.modo .niv i{display:inline-block;height:8px;border-radius:4px;background:#157a45;vertical-align:middle;margin-left:6px}
.modo:active{transform:translateY(4px);box-shadow:0 2px 0 #8fa6c6}
.modo .ic{font-size:clamp(40px,7vmin,64px);line-height:1}
.modo h3{font-size:clamp(24px,3.6vmin,34px);font-weight:900}
.modo p{margin:0;font-size:clamp(16px,2.3vmin,21px);line-height:1.25}
.fila-botones{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:100%;max-width:1000px}
.fila-botones .btn{width:100%}

/* juego */
#p-juego{padding:4px 14px 12px;gap:8px}
.hud{display:grid;grid-template-columns:1fr 1fr 1.7fr 1fr;gap:8px;position:relative;z-index:25}
.celda{background:rgba(255,255,255,.14);border-radius:14px;padding:6px 10px;min-height:56px;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative}
.celda small{font-size:13px;opacity:.95;text-transform:uppercase;letter-spacing:.5px}
.celda b{font-size:clamp(22px,3.4vmin,32px);font-weight:900;white-space:nowrap}
.celda.reloj{background:rgba(255,255,255,.2);align-items:center;text-align:center}
.celda.reloj b{font-variant-numeric:tabular-nums;font-size:clamp(34px,6.4vmin,60px);line-height:1.05}
.celda.reloj.urge{background:#8c1722}
.celda.reloj.urge b{color:#fff}
.celda.reloj.golpe{animation:golpe .7s}
@keyframes golpe{0%{background:#d62839;transform:scale(1.07)}100%{transform:scale(1)}}
.pen-anim{position:absolute;right:8px;top:-6px;font-size:clamp(20px,3.4vmin,30px);font-weight:900;color:#ffb3bb;text-shadow:0 2px 0 rgba(0,0,0,.5);opacity:0;pointer-events:none}
.pen-anim.ver{animation:resta 1.4s ease-out}
@keyframes resta{0%{opacity:0;transform:translateY(0)}12%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
.barranivel{height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:4px}
.barranivel i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7be39a,#ffd23f);transition:width .4s}
.barra-global{height:8px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;flex:0 0 auto}
.barra-global i{display:block;height:100%;width:100%;background:#7be39a;transform-origin:left;transform:scaleX(1)}
.barra-global i.medio{background:#ffd23f}.barra-global i.poco{background:#ff6b78}
.cuerpo{flex:1;min-height:0;display:grid;gap:10px;position:relative;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"card" "deco" "keys"}
.tarjeta{grid-area:card}.deco{grid-area:deco}.teclado-juego{grid-area:keys}
@media (orientation:landscape) and (min-width:700px){
  .cuerpo{grid-template-columns:minmax(0,1fr) clamp(320px,32vw,460px);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"card deco" "card keys"}
  .tarjeta{justify-content:center}
}
.tarjeta{background:var(--papel);color:var(--tinta);border-radius:22px;padding:10px 16px 12px;box-shadow:0 6px 0 rgba(0,0,0,.25);
  display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;min-width:0}
.tarjeta .cat{font-size:16px;font-weight:800;color:#a8281c;text-transform:uppercase;letter-spacing:.6px}
#expr{font-size:clamp(48px,7.2vmin,78px);font-weight:900;white-space:nowrap;overflow:hidden;max-width:100%;text-align:center;line-height:1.25;width:100%;
  font-variant-numeric:tabular-nums}
#resp{min-width:200px;border:4px solid var(--oro);border-radius:16px;background:#fff;font-size:clamp(40px,6vmin,60px);font-weight:900;padding:2px 24px;min-height:70px;
  display:flex;align-items:center;justify-content:center;gap:10px}
#resp.vacia{color:var(--suave)}
#resp.ok{border-color:#157a45;background:#e3f7ea}
.fila-extra{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;font-size:15px;font-weight:700;color:#3d526e}
.bonus{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.estrellas{letter-spacing:2px;font-size:18px;color:#c9d3e3}
.estrellas b{color:#c78a00;font-weight:400}
#toast{color:#0d6b3a;font-weight:900;font-size:18px;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
#toast.aviso{color:#a61e2d}
#toast.ver{animation:toast 1.4s}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:translateY(0)}85%{opacity:1}100%{opacity:0}}
.deco{min-height:0;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.deco svg{height:100%;max-height:100%;width:auto;min-height:0}
.bola{fill:#35506e;stroke:#1d2f45;stroke-width:1.5;transition:fill .25s}
.bola.on{fill:var(--c);stroke:#fff;stroke-width:2.5}
.bola.rota{animation:romper .55s}
@keyframes romper{0%{fill:#fff;stroke:#ff3b4d;stroke-width:7;opacity:.3}100%{stroke-width:1.5;opacity:1}}
.estrella{fill:#6a5a2a;transition:fill .3s}
.estrella.on{fill:#ffd23f}
.teclado-juego{display:flex;flex-direction:column;justify-content:flex-end}
#fb-error{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(5,15,35,.8);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;overflow-y:auto}
#fb-error .caja{background:#fff;color:var(--tinta);border-radius:24px;padding:18px 22px;max-width:680px;width:100%;max-height:100%;overflow-y:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.3);margin:auto}
#fb-error h3{font-size:26px;margin-bottom:4px}
#fb-error .cuenta{font-size:clamp(32px,6vmin,52px);font-weight:900;margin:2px 0}
#fb-error p{margin:5px 0;font-size:18px;line-height:1.3}
#fb-error .pen{color:#a61e2d;font-weight:800}
#fbe-expl{text-align:left;font-size:18px;line-height:1.35;background:#eef4fc;border-radius:14px;padding:8px 12px;margin:6px 0}
#fbe-expl .pasos div{padding:2px 0}
#fbe-expl .regla{margin-top:5px;font-weight:700;color:#12263f}
#fbe-expl .animo{margin-top:5px;font-size:16px;color:#3d526e}

/* resultados / clasificación */
.res-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 28px;max-width:1040px;width:100%;margin:0 auto}
@media (orientation:landscape) and (min-width:700px){.res-layout{grid-template-columns:1.1fr 1fr;align-items:center;margin:auto}}
.res-cab{text-align:center}
.medalla{font-size:clamp(56px,10vmin,96px);line-height:1}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:760px;width:100%;margin:8px auto}
.dato{background:rgba(255,255,255,.95);color:var(--tinta);border-radius:16px;padding:8px;text-align:center}
.dato b{display:block;font-size:clamp(26px,4.4vmin,40px);font-weight:900}
.dato span{font-size:15px;font-weight:700;color:#3d526e}
.dato.grande{grid-column:1/-1;background:#fff3c4}
.res-niv{max-width:760px;width:100%;margin:4px auto;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:16px}
.res-niv .fn{display:flex;flex-direction:column;gap:2px}
.res-niv .fn div{display:flex;justify-content:space-between;font-weight:700}
.res-codigo{text-align:center;font-size:18px;margin:6px 0}
.res-codigo code{display:inline-block;background:#fff;color:var(--tinta);border-radius:10px;padding:6px 14px;font-size:22px;font-weight:900;
  -webkit-user-select:text;user-select:text;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:4px;word-break:break-all}
.res-botones{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:760px;width:100%;margin:8px auto 0}
.res-botones .btn{width:100%}
.res-botones .grande{grid-column:1/-1}
.res-pos{text-align:center;font-size:20px;font-weight:800;color:#ffe8a0}
.res-aviso{text-align:center;font-size:17px;min-height:22px;color:#ffe8a0}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.tab{min-height:56px;padding:8px 18px;border-radius:14px;border:0;background:rgba(255,255,255,.18);font-weight:800;font-size:18px;color:#fff}
.tab.sel{background:var(--oro);color:#3a2a00}
table.tabla{border-collapse:separate;border-spacing:0;width:100%;max-width:760px;margin:6px auto;background:rgba(255,255,255,.96);color:var(--tinta);border-radius:14px;font-size:18px}
table.tabla th,table.tabla td{padding:8px 10px;text-align:center;border-bottom:1px solid #dbe5f3}
table.tabla th{background:#dbe7fa;font-size:15px}
table.tabla tr.yo td{background:#fff3c4;font-weight:900}
table.tabla tr.sep td{background:#eef3fb;color:#3d526e;font-size:15px;padding:2px}
.empate{font-size:13px;color:#3d526e;font-weight:700}

/* modal */
#modal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:rgba(3,10,25,.78);display:flex;align-items:center;justify-content:center;padding:14px;
  padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom))}
#modal.opaco{background:#07142b}
#modal-caja{background:#fff;color:var(--tinta);border-radius:24px;padding:20px 22px;max-width:760px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 10px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px;--tecla:clamp(52px,7vh,68px)}
@supports (height:1dvh){#modal-caja{--tecla:clamp(52px,7dvh,68px)}}
#modal-caja.ancho{max-width:980px;min-height:60%}
#modal-caja .tecla{background:#e6eefb;box-shadow:0 4px 0 #9fb3cc}
#modal-caja .tecla.acc{background:#ffe3a3;box-shadow:0 4px 0 #c79a2a}
#modal-caja .tecla.entrar{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s)}
#modal-caja h2{font-size:28px}
#modal-caja p,#modal-caja li{font-size:18px;line-height:1.35;margin:4px 0}
#modal-caja .btn{box-shadow:0 4px 0 #9fb3cc;background:#e6eefb}
#modal-caja .btn.verde{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-s)}
#modal-caja .btn.rojo{background:var(--rojo);color:#fff;box-shadow:0 4px 0 #8c1722}
#modal-caja .tab{background:#e6eefb;color:var(--tinta)}
#modal-caja .tab.sel{background:var(--oro);color:#3a2a00}
#modal-caja table.tabla{background:#fff;max-width:none;font-size:16px}
#modal-caja table.tabla th{position:sticky;top:0;z-index:2}
#modal-caja .visor{min-height:64px;font-size:44px}
.modal-botones{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.aviso-ok{color:#0d6b3a;font-weight:800;min-height:24px}
.aviso-mal{color:#a61e2d;font-weight:800}
textarea.csv{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;border:2px solid #9fb3cc;border-radius:12px;padding:8px;color:var(--tinta)}
.modelo h3{font-size:20px;margin:12px 0 2px}
.modelo code{background:#eef3fb;border-radius:6px;padding:1px 6px;-webkit-user-select:text;user-select:text}
.modelo details{margin:8px 0}.modelo summary{font-weight:800;font-size:18px;min-height:44px;cursor:pointer;display:flex;align-items:center}
.pin-puntos{letter-spacing:10px}
.reloj-pausa{font-size:56px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.seccion{border-top:2px solid #dbe5f3;padding-top:8px;margin-top:6px}
.seccion h3{font-size:19px;margin:2px 0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- móvil y pantallas pequeñas ---- */
@media (max-width:600px){
  .logo{font-size:18px}.logo .logo-t{display:none}
  .btn-barra{padding:0 10px;font-size:16px;min-height:48px}
  #btn-sonido{width:48px;height:48px;font-size:24px}
  .hud{grid-template-columns:1fr 1fr 1.5fr 1fr;gap:5px}
  .celda{padding:4px 6px;min-height:46px}.celda small{font-size:10px;letter-spacing:0}.celda b{font-size:18px}
  .celda.reloj b{font-size:30px}
  .res-grid{grid-template-columns:repeat(2,1fr)}.res-niv{grid-template-columns:1fr}
  .res-botones{grid-template-columns:1fr}
  #fbe-expl,#fb-error p{font-size:16px}
}
@media (max-width:400px){body.en-juego #chip-alumno{display:none}}
@media (max-height:760px) and (orientation:portrait){.deco{display:none}}
@media (max-height:700px) and (orientation:portrait){
  :root{--tecla:clamp(42px,7.2vh,54px)}
  .tarjeta{padding:6px 12px 8px;gap:3px}#expr{line-height:1.15}#resp{min-height:54px;font-size:38px}
  .titulo{font-size:28px}.modo{min-height:110px;padding:10px}.modo p{font-size:15px}
  .visor{min-height:60px;font-size:44px}.escena svg{height:110px}
  .teclado{gap:8px}
}
@media (max-height:600px) and (orientation:portrait){
  :root{--tecla:clamp(36px,6.4vh,42px)}
  #barra{min-height:44px;padding:4px 10px}.btn-barra{min-height:44px}#btn-sonido{width:44px;height:44px;font-size:22px}
  #p-juego{padding:2px 8px 6px;gap:4px}
  .celda{min-height:40px}.celda b{font-size:16px}.celda.reloj b{font-size:24px}
  #expr{font-size:clamp(30px,9vw,44px)}#resp{min-height:44px;font-size:30px;border-width:3px}.tarjeta .cat{font-size:12px}.fila-extra{min-height:22px;font-size:12px}.estrellas{font-size:14px}
  .teclado{gap:5px}
}
@media (max-height:720px) and (orientation:landscape){
  .hud{gap:6px}.celda{min-height:48px;padding:3px 10px}.celda.reloj b{font-size:clamp(30px,6vmin,46px)}.deco svg{max-height:100%}
  #resp{min-height:56px}
}
@media (max-height:480px){
  :root{--tecla:clamp(34px,10.5vh,44px)}
  #barra{min-height:44px;padding:3px 10px;gap:6px}.logo{font-size:18px;min-height:40px;padding:2px 6px}
  #chip-alumno{padding:4px 12px;font-size:16px}
  #btn-sonido{width:44px;height:44px;font-size:22px}.btn-barra{min-height:44px;font-size:15px}
  .pantalla{padding:2px 12px 6px}
  .titulo{font-size:24px}.sub{font-size:15px;margin:2px 0}
  .lista-grid{grid-template-columns:1fr 1fr;gap:6px 22px}
  .lista-izq .escena{display:none}
  .visor{min-height:46px;font-size:32px;border-width:3px}.visor.vacio{font-size:22px}.msg{min-height:18px;font-size:15px}
  .lista-der{gap:6px}.teclado{gap:6px}
  #p-menu{gap:6px}.modos{grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto}.modo{min-height:96px;padding:6px 10px;border-radius:16px}.modo .ic{font-size:30px}.modo h3{font-size:19px}.modo p{font-size:13px}
  #p-menu .escena{display:none}
  .btn{min-height:44px;padding:6px 14px;font-size:16px}
  #p-juego{padding:2px 10px 4px;gap:4px}
  .celda{min-height:38px;padding:2px 8px}.celda small{font-size:10px}.celda b{font-size:18px}.celda.reloj b{font-size:26px}
  .cuerpo{grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:minmax(0,1fr);grid-template-areas:"card keys";gap:8px}
  .deco{display:none}
  .tarjeta{padding:4px 10px;gap:2px;justify-content:center}.tarjeta .cat{font-size:12px}
  #expr{font-size:clamp(30px,11vh,46px)}#resp{min-height:40px;font-size:28px;border-width:3px;padding:0 14px;min-width:120px}
  .fila-extra{min-height:22px;font-size:12px}.estrellas{font-size:14px}#toast{font-size:14px}
  #modal-caja{padding:12px 14px;gap:6px}#modal-caja h2{font-size:22px}#modal-caja p,#modal-caja li{font-size:15px}
  .medalla{font-size:40px}.res-grid{gap:6px;margin:4px auto}.dato b{font-size:22px}.dato span{font-size:12px}
}

/* ---------- MAPA DE MUNDOS (portada) ---------- */
.mapa-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;width:100%;max-width:1040px}
.mapa-cab .titulo{margin:0}
.mapa-resumen{display:flex;gap:8px;flex-wrap:wrap;font-weight:800;font-size:clamp(14px,2vmin,18px)}
.mapa-resumen span{background:rgba(0,0,0,.35);border:2px solid var(--tiza2);border-radius:999px;padding:5px 12px;white-space:nowrap}
.mapa{position:relative;width:100%;max-width:1040px;aspect-ratio:5/3;border-radius:22px;overflow:hidden;border:4px solid var(--tiza);
  background:linear-gradient(180deg,#5cc8ff 0%,#a8e6ff 52%,#7bd36b 52.2%,#4fae4a 100%);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.mapa svg.fondo{position:absolute;inset:0;width:100%;height:100%}
.nodo{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:0;color:#10322c;width:clamp(96px,17%,170px);text-align:center}
.nodo .disco{width:clamp(54px,7.6vw,84px);height:clamp(54px,7.6vw,84px);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:clamp(18px,2.6vw,30px);background:#fff;border:5px solid #8a6a3a;box-shadow:0 5px 0 rgba(0,0,0,.3);position:relative;color:#10322c}
.nodo:active .disco{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.nodo .num{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;background:#10322c;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.nodo .nombre{font-size:clamp(11px,1.5vw,16px);font-weight:900;line-height:1.1;background:rgba(255,255,255,.85);border-radius:8px;padding:2px 6px}
.nodo .nivel{font-size:clamp(10px,1.35vw,14px);font-weight:800;background:rgba(16,50,44,.88);color:#fff;border-radius:8px;padding:2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.segs{display:flex;gap:2px}.segs i{width:clamp(5px,.9vw,9px);height:8px;border-radius:2px;background:#5b7a72;display:block}
.segs i.on{background:#ffd23f}.segs i.meta{outline:2px solid #fff;outline-offset:0}.segs i.on.meta{background:#52e07a}
.nodo.n0 .disco{border-color:#8a6a3a}.nodo.n1 .disco{border-color:#e0a21b}.nodo.n2 .disco{border-color:#2fbf5b;background:#e8ffee}
.nodo.n2 .disco::after{content:"★";position:absolute;right:-10px;top:-12px;font-size:clamp(20px,2.6vw,30px);color:#ffd23f;text-shadow:0 2px 0 #10322c,0 0 6px #fff}
.nodo.sugerido .disco{animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 0 rgba(255,226,122,.9)}50%{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 14px rgba(255,226,122,0)}}
.nodo.castillo .disco{background:#3a2a52;border-color:#c0392b;color:#fff;font-size:clamp(26px,3.6vw,44px);border-radius:16px}
.nodo.castillo.bloq .disco{filter:grayscale(.85) brightness(.8);border-color:#555}
.nodo.castillo.abierto .disco{border-color:#ffd23f;animation:pulso 1.2s ease-in-out infinite}
.nodo.castillo.vencido .disco{border-color:#ffd23f;background:#5a3a8a}
.heroe{position:absolute;left:var(--x);top:var(--y);width:clamp(30px,4vw,50px);transform:translate(-50%,-195%);pointer-events:none;animation:salto 1s ease-in-out infinite;z-index:3}
@keyframes salto{0%,100%{transform:translate(-50%,-195%)}50%{transform:translate(-50%,-235%)}}
.mapa-faltan{width:100%;max-width:1040px;font-size:clamp(14px,2vmin,18px);font-weight:700;text-align:center;background:rgba(0,0,0,.35);border:2px dashed var(--tiza2);border-radius:14px;padding:8px 12px}
.mapa-faltan b{color:var(--acento)}
@media (orientation:portrait) and (min-width:640px){.mapa{aspect-ratio:4/3}}
@media (max-width:639px),(max-height:520px){
  .mapa{aspect-ratio:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:linear-gradient(180deg,#7bd36b,#4fae4a)}
  .mapa svg.fondo,.heroe{display:none}
  .nodo{position:static;transform:none;flex-direction:row;width:100%;gap:10px;text-align:left;background:rgba(255,255,255,.9);border-radius:16px;padding:8px 10px}
  .nodo .nombre{background:none;flex:1;font-size:15px}.nodo .nivel{background:none;color:#10322c;font-size:12px;align-items:flex-start}
  .nodo .disco{width:54px;height:54px;font-size:20px;flex:0 0 auto}
}
@media (min-width:640px) and (max-height:520px){.mapa{flex-direction:row;flex-wrap:wrap}.nodo{width:calc(33.3% - 7px)}}
.mapa{flex-shrink:0}
/* ---------- JEFE FINAL ---------- */
.deco-jefe{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;max-height:100%}
.jefe-svg{width:100%;max-width:min(230px,26vh);height:auto;display:block;margin:0 auto}
.jefe-svg.golpe{animation:golpe .45s}.jefe-svg.rie{animation:ríe .6s}
@keyframes golpe{0%{transform:translateX(0);filter:none}20%{transform:translateX(-9px) rotate(-3deg);filter:brightness(2.2)}50%{transform:translateX(9px) rotate(3deg)}100%{transform:none}}
@keyframes ríe{0%,100%{transform:translateY(0)}25%{transform:translateY(-8px) scale(1.04)}50%{transform:translateY(0)}75%{transform:translateY(-6px) scale(1.03)}}
.corazones{letter-spacing:2px;font-size:20px}
.boss-barra{width:100%;max-width:230px;height:14px;border-radius:8px;background:#40202a;border:2px solid #fff;margin:6px auto 0;overflow:hidden}
.boss-barra i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ffd23f);transition:width .4s}
.boss-nombre{text-align:center;font-weight:900;letter-spacing:1px;margin-top:4px;color:#ffb3b3;font-size:15px}
.refuerzo,.leccion{margin-top:8px}
body.jefe{background:radial-gradient(ellipse at 50% 10%,#4b2b6b 0%,#241438 60%,#120a1f 100%) fixed}
body.jefe .tarjeta .cat{color:#7b1fa2}
.vidas-fin{font-size:34px;letter-spacing:4px;text-align:center}
</style>
</head>
<body>
<canvas id="nieve" aria-hidden="true"></canvas>
<div id="app">
  <header id="barra">
    <button id="logo" class="logo" type="button" aria-label="Repaso de Mates"><span aria-hidden="true">∑</span><span class="logo-t">Repaso de Mates</span></button>
    <button id="btn-pausa" class="btn-barra" type="button" hidden>⏸ Pausa</button>
    <button id="btn-salir" class="btn-barra" type="button" hidden>✔ Terminar</button>
    <div id="chip-alumno" hidden></div>
    <button id="btn-sonido" type="button" aria-label="Silenciar sonido" aria-pressed="false">🔊</button>
  </header>
  <main id="pantallas">

    <!-- 0. CURSO Y GRUPO -->
    <section id="p-curso" class="pantalla scroll" aria-label="Curso y grupo">
      <div class="curso-caja">
        <h1 class="titulo">Repaso de mates</h1>
        <p class="sub">¿En qué <b>curso</b> estás?</p>
        <div class="fila-opc" id="opc-curso" role="group" aria-label="Curso"></div>
        <p class="sub">¿Y en qué <b>grupo</b>?</p>
        <div class="fila-opc" id="opc-grupo" role="group" aria-label="Grupo"></div>
        <div class="msg" id="msg-curso" role="status"></div>
        <button type="button" class="btn verde grande" id="curso-sig" disabled>Siguiente ▶</button>
        <button type="button" class="btn suave" id="curso-recuperar">♻ Recuperar mi progreso</button>
      </div>
    </section>

    <!-- 1. NÚMERO DE LISTA -->
    <section id="p-lista" class="pantalla scroll" aria-label="Identificación">
      <div class="lista-grid">
        <div class="lista-izq">
          <h1 class="titulo">Repaso de mates</h1>
          <p class="sub" id="sub-lista">Escribe tu <b>número de lista</b> (del 1 al 40)</p>
          <button type="button" class="btn" id="btn-curso">Cambiar curso o grupo</button>
          <div class="escena" id="escena-lista" aria-hidden="true"></div>
        </div>
        <div class="lista-der">
          <div class="visor vacio" id="visor-lista" role="status" aria-live="polite">Tu número</div>

    '<h3>Refuerzo</h3><p>Si el alumno falla 4 de las últimas 6 preguntas (con al menos 5 respondidas), se activa el refuerzo: baja 2 niveles, se muestra el resumen de la regla y se repite hasta acertar 3 seguidas. Las preguntas falladas vuelven 3 preguntas después con otros números.</p>' +
    '<h3>Código de resultado</h3><p>El código <code>L2C17-RP3-15-3-62-261124-1542-K7M</code> es: curso y grupo 2.º C, lista 17, tema 3, 15 aciertos, 3 errores, nivel 6,2, fecha 24/11/2026 15:42 y 3 caracteres de control (detectan erratas; no es una firma).</p>' +

  /* --- símbolos matemáticos flotando en canvas (≤ 40) --- */
  var Nieve = {
    iniciar: function () {
      var cv = $('nieve'), cx = cv.getContext && cv.getContext('2d'); if (!cx) return;
      var w = 0, h = 0, copos = [], N = 34, i, GL = ['π', 'Σ', '√', '∞', '÷', '×', '+', '−', '=', '%', '²', '∠'];
      var reducido = G.matchMedia && G.matchMedia('(prefers-reduced-motion: reduce)').matches;
      function medir() { var dpr = Math.min(G.devicePixelRatio || 1, 2); w = G.innerWidth; h = G.innerHeight; cv.width = w * dpr; cv.height = h * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      medir(); G.addEventListener('resize', medir);
      for (i = 0; i < N; i++) copos.push({ x: Math.random() * w, y: Math.random() * h, r: 14 + Math.random() * 22, v: 0.15 + Math.random() * 0.45, d: Math.random() * 6.28, g: GL[i % GL.length] });
      function pintar() {
        cx.clearRect(0, 0, w, h); cx.fillStyle = 'rgba(243,241,231,.13)'; cx.textAlign = 'center';
        for (var k = 0; k < copos.length; k++) { var c = copos[k]; cx.font = Math.round(c.r) + 'px serif'; cx.fillText(c.g, c.x, c.y); }
      }
      function paso() {
        for (var k = 0; k < copos.length; k++) { var c = copos[k]; c.y += c.v; c.d += 0.01; c.x += Math.sin(c.d) * 0.4; if (c.y > h + 40) { c.y = -40; c.x = Math.random() * w; } }

      }

    }
